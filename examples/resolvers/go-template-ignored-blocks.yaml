# Run: scafctl run solution -f examples/resolvers/go-template-ignored-blocks.yaml -o json

apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: go-template-ignored-blocks
  displayName: Go Template Ignored Blocks
  category: resolvers
  tags:
    - resolver-example
    - template
  description: |
    Preserve literal content that conflicts with Go template delimiters
    using ignoredBlocks. Modes: start/end for multi-line blocks, line for
    single-line markers, and token for a literal substring. The built-in
    zero-config fence ({{/* scafctl:ignore:start */}} ... {{/* scafctl:ignore:end */}})
    and per-line marker (# scafctl:ignore) need no declaration.

spec:
  resolvers:
    instanceType:
      resolve:
        with:
          - provider: static
            inputs:
              value: t3.medium

    # --- start/end mode: multi-line block ---
    terraformConfig:
      description: Generates Terraform with mixed scafctl + Terraform syntax
      dependsOn: [instanceType]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              name: terraform
              template: |
                resource "aws_instance" "main" {
                  ami           = "ami-0123456789"
                  instance_type = "{{ .instanceType }}"
                  /*scafctl:ignore:start*/
                  tags = {
                    Name = "${var.project}-${var.env}"
                    ManagedBy = "terraform"
                  }
                  /*scafctl:ignore:end*/
                }
              ignoredBlocks:
                - start: "/*scafctl:ignore:start*/"
                  end: "/*scafctl:ignore:end*/"

    appName:
      resolve:
        with:
          - provider: static
            inputs:
              value: my-app

    # --- line mode: single-line ignore ---
    githubWorkflow:
      description: Preserve GitHub Actions expressions on specific lines
      dependsOn: [appName]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              name: workflow
              template: |
                name: Deploy {{ .appName }}
                on: [push]
                jobs:
                  deploy:
                    runs-on: ubuntu-latest
                    steps:
                      - run: echo ${{ secrets.TOKEN }}  # scafctl:ignore
                      - run: echo ${{ github.sha }}  # scafctl:ignore
              ignoredBlocks:
                - line: "# scafctl:ignore"

    # --- built-in fence: zero-config, markers stripped from output ---
    builtinFence:
      description: Uses the always-on built-in fence -- no ignoredBlocks needed
      dependsOn: [appName]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              name: builtin-fence
              template: |
                app: {{ .appName }}
                {{/* scafctl:ignore:start */}}
                raw_block = "${not.parsed.by.go}"
                {{/* scafctl:ignore:end */}}
                token: ${{ secrets.TOKEN }}  # scafctl:ignore

    # --- token mode: preserve every occurrence of a literal substring ---
    literalTokens:
      description: Preserve a literal token wherever it appears
      dependsOn: [appName]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              name: tokens
              template: |
                service: {{ .appName }}
                url: ${LITERAL}/api
                healthcheck: ${LITERAL}/health
              ignoredBlocks:
                - token: "${LITERAL}"
