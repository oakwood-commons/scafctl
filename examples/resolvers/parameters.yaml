# Run: scafctl run resolver -f parameters.yaml
# Run: scafctl run resolver -f parameters.yaml -r name=Alice -r count=5
# Run: scafctl run resolver -f parameters.yaml -r @params.yaml
# Run: echo '{"name": "Alice", "count": 5}' | scafctl run resolver -f parameters.yaml -r @-
# Run: echo Alice | scafctl run resolver -f parameters.yaml name=@-
# Run: scafctl run resolver -f parameters.yaml name=@name.txt

apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: parameters-example
  displayName: Parameters Example
  category: resolvers
  tags:
    - resolver-example
  description: |
    CLI parameter usage with default values and type coercion.
    Demonstrates positional args, -r flag, @file loading, @- stdin,
    and raw stdin piping into individual parameters.

spec:
  resolvers:
    # String parameter with inline default
    # When "name" is not passed via -r, the default value "World" is used.
    # The "default" input must be a literal value (not a ValueRef).
    name:
      description: User name from CLI or default
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: name
              default: "World"

    # Integer parameter with inline default
    count:
      description: Repetition count
      type: int
      resolve:
        with:
          - provider: parameter
            inputs:
              key: count
              default: 3

    # Boolean parameter with inline default
    uppercase:
      description: Whether to uppercase the output
      type: bool
      resolve:
        with:
          - provider: parameter
            inputs:
              key: uppercase
              default: false

    # String parameter using fallback chain (alternative pattern)
    # Use onError: continue + static provider when you need a dynamic
    # fallback (e.g. a ValueRef or expression) instead of a literal default.
    region:
      description: Deployment region from CLI or fallback chain
      type: string
      resolve:
        with:
          - provider: parameter
            onError: continue
            inputs:
              key: region
          - provider: static
            inputs:
              value: "us-east-1"
    
    # Computed greeting using parameters
    greeting:
      description: Final greeting message
      type: string
      resolve:
        with:
          - provider: cel
            inputs:
              expression: |
                _.uppercase 
                  ? ('Hello, ' + _.name + '!').upperAscii()
                  : 'Hello, ' + _.name + '!'
    
    # Array output using count
    greetings:
      description: Multiple greetings based on count
      type: array
      resolve:
        with:
          - provider: cel
            inputs:
              # Create array of greetings
              expression: |
                lists.range(_.count).map(i, _.greeting + ' (#' + string(i + 1) + ')')
