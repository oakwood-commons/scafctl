# Run: scafctl run resolver -f parameters.yaml
# Run: scafctl run resolver -f parameters.yaml -r name=Alice -r count=5
# Run: scafctl run resolver -f parameters.yaml -r @params.yaml
# Run: echo '{"name": "Alice", "count": 5}' | scafctl run resolver -f parameters.yaml -r @-
# Run: echo Alice | scafctl run resolver -f parameters.yaml name=@-
# Run: scafctl run resolver -f parameters.yaml name=@name.txt

apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: parameters-example
  displayName: Parameters Example
  category: resolvers
  tags:
    - resolver-example
  description: |
    CLI parameter usage with default values and type coercion.
    Demonstrates positional args, -r flag, @file loading, @- stdin,
    raw stdin piping into individual parameters, alias keys, and the
    map read mode (keys + as: map). For the "read every supplied
    parameter" mode (all: true), see parameters-all.yaml.

spec:
  resolvers:
    # String parameter with inline default
    # When "name" is not passed via -r, the default value "World" is used.
    # The "default" input must be a literal value (not a ValueRef).
    name:
      description: User name from CLI or default
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: name
              default: "World"

    # Integer parameter with inline default
    count:
      description: Repetition count
      type: int
      resolve:
        with:
          - provider: parameter
            inputs:
              key: count
              default: 3

    # Boolean parameter with inline default
    uppercase:
      description: Whether to uppercase the output
      type: bool
      resolve:
        with:
          - provider: parameter
            inputs:
              key: uppercase
              default: false

    # String parameter using fallback chain (alternative pattern)
    # Use continueOnError: true + static provider when you need a dynamic
    # fallback (e.g. a ValueRef or expression) instead of a literal default.
    region:
      description: Deployment region from CLI or fallback chain
      type: string
      resolve:
        with:
          - provider: parameter
            continueOnError: true
            inputs:
              key: region
          - provider: static
            inputs:
              value: "us-east-1"

    # Parameter with alias keys (first-match-wins)
    # "keys" accepts the same logical parameter under several flag names.
    # Names are tried in declared order, so when more than one alias is
    # passed the earliest one in the list wins.
    #   scafctl run resolver -f parameters.yaml -r environment=prod
    #   scafctl run resolver -f parameters.yaml -r e=staging
    #   scafctl run resolver -f parameters.yaml -r env=qa
    environment:
      description: Target environment (accepts environment, e, or env)
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              keys: [environment, e, env]
              default: dev


    # Computed greeting using parameters
    greeting:
      description: Final greeting message
      type: string
      resolve:
        with:
          - provider: cel
            inputs:
              expression: |
                _.uppercase 
                  ? ('Hello, ' + _.name + '!').upperAscii()
                  : 'Hello, ' + _.name + '!'
    
    # Array output using count
    greetings:
      description: Multiple greetings based on count
      type: array
      resolve:
        with:
          - provider: cel
            inputs:
              # Create array of greetings
              expression: |
                lists.range(_.count).map(i, _.greeting + ' (#' + string(i + 1) + ')')

    # Read a set of DISTINCT parameters at once into a map (opt in with as: map).
    # This differs from alias "keys" (first-match-wins): here every listed name
    # is its own entry. Absent keys are OMITTED from the map (not defaulted), so
    # has()/optional chaining against the map stay faithful.
    #   scafctl run resolver -f parameters.yaml -r tier=gold -r region=us-west-2
    featureBag:
      description: A distinct set of parameters read into a map
      resolve:
        with:
          - provider: parameter
            inputs:
              keys: [tier, region, cluster]
              as: map

    # Downstream resolver that consumes the map. Because absent keys are omitted,
    # use optional chaining (?key.orValue) or has() for values that may be absent.
    tierSummary:
      description: Summary derived from the featureBag map
      type: string
      resolve:
        with:
          - provider: cel
            inputs:
              expression: |
                'tier=' + _.featureBag.?tier.orValue('default') +
                ' keys=' + string(_.featureBag.size())
