apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: template-functions-demo
  displayName: Template Functions Demo
  description: |
    Demonstrates the custom Go template functions available in scafctl:
    slugify, toDnsString, where, selectField, cel, toHcl, toYaml, fromYaml.
    Also shows the CEL strings.slugify function, which shares its
    implementation with the go-template slugify.
  category: demo
  tags:
    - templates
    - functions
    - demo
bundle:
  plugins:
    - name: metadata
      kind: provider
      version: latest
spec:
  resolvers:
    # Source data
    project-name:
      resolve:
        with:
          - provider: static
            inputs:
              value: "My Cool Project!"

    services:
      resolve:
        with:
          - provider: static
            inputs:
              value:
                - name: api-gateway
                  port: 8080
                  active: true
                - name: auth-service
                  port: 8081
                  active: true
                - name: legacy-proxy
                  port: 9090
                  active: false

    metadata:
      resolve:
        with:
          - provider: static
            inputs:
              value:
                name: my-solution
                tags:
                  - alpha
                  - beta
                database:
                  host: db.example.com
                  port: 5432

    # slugify — convert any string to a DNS-safe slug
    slugified-name:
      dependsOn: [project-name]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ slugify (index . "project-name") }}'
              name: slugify-demo
      # Result: "my-cool-project"

    # strings.slugify — the same DNS-safe slug via a CEL expression.
    # The CEL strings.slugify and the Go template slugify share one
    # implementation (pkg/dnslabel), so their output is identical.
    cel-slugified-name:
      dependsOn: [project-name]
      resolve:
        with:
          - provider: cel
            inputs:
              expression: 'strings.slugify(_["project-name"])'
      # Result: "my-cool-project"

    # toDnsString — strict RFC 1123 DNS label
    dns-label:
      dependsOn: [project-name]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ toDnsString (index . "project-name") }}'
              name: dns-demo
      # Result: "my-cool-project"

    # where — filter a list by field value
    active-services:
      dependsOn: [services]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ where "active" true .services | toYaml }}'
              name: where-demo
      # Returns only services where active == true

    # selectField — extract a single field from each item
    service-names:
      dependsOn: [services]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ selectField "name" .services | toYaml }}'
              name: select-demo
      # Returns: ["api-gateway", "auth-service", "legacy-proxy"]

    # selectField on a map — existence check + dotted key path
    has-tags:
      dependsOn: [metadata]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ if .metadata | selectField "tags" }}yes{{ else }}no{{ end }}'
              name: select-map-demo
      # Returns "yes": a map input yields a one-element list (empty if absent)

    db-host:
      dependsOn: [metadata]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ .metadata | selectField "database.host" | first }}'
              name: select-dotted-demo
      # Returns "db.example.com": dotted paths descend into nested maps

    # cel — inline CEL expression in a Go template
    active-count:
      dependsOn: [services]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ cel "size(_.services.filter(s, s.active == true))" . }}'
              name: cel-demo
      # Returns: "2"

    # toYaml / fromYaml — round-trip YAML serialization
    yaml-roundtrip:
      dependsOn: [services]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: |
                {{ $wrapped := dict "items" .services }}
                {{ $yaml := toYaml $wrapped }}
                {{ $parsed := fromYaml $yaml }}
                Service count: {{ len (index $parsed "items") }}
              name: yaml-demo

    # Runtime metadata via metadata provider (no inputs needed)
    solution-meta:
      resolve:
        with:
          - provider: metadata
            inputs: {}
