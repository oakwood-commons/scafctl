# Lint stress-test solution -- intentionally triggers many lint rules.
# Run: scafctl lint -f examples/solutions/lint-stress-test/solution.yaml
#
# Rules NOT triggered here (require special setups):
#   resolver-cycle          -- cycles prevent solution loading entirely
#   missing-template-dependency -- requires external .tpl files on disk
#                                  (see tests/integration/solutions/lint-missing-template-dependency)

apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: lint-stress-test
  description: Triggers many lint rules for testing table output

spec:
  resolvers:
    # missing-provider
    bad_provider:
      type: string
      resolve:
        with:
          - provider: nonexistent-provider
            inputs:
              value: hello

    # hyphenated-name
    my-hyphenated-name:
      type: string
      description: Resolver with hyphens triggers hyphenated-name warning
      resolve:
        with:
          - provider: static
            inputs:
              value: "hyphens bad"

    # invalid-expression (bad CEL in when)
    guarded:
      type: string
      resolve:
        with:
          - provider: static
            when: "this is not valid cel %%!!"
            inputs:
              value: fallback

    # unused-resolver + missing-description
    orphan_value:
      type: string
      resolve:
        with:
          - provider: static
            inputs:
              value: "nobody uses me"

    # another unused-resolver + missing-description
    orphan_two:
      type: string
      resolve:
        with:
          - provider: static
            inputs:
              value: "also unused"

    # long-timeout
    slow_call:
      type: string
      description: This takes too long
      timeout: 600s
      resolve:
        with:
          - provider: static
            inputs:
              value: "slow"

    # missing-fallback-source (all sources conditional, no fallback)
    conditional_only:
      type: string
      description: All sources are conditional with no fallback
      resolve:
        with:
          - provider: static
            when:
              expr: '_.main_output == "prod"'
            inputs:
              value: "prod-value"
          - provider: static
            when:
              expr: '_.main_output == "staging"'
            inputs:
              value: "staging-value"

    # non-validation-provider in validate block
    wrong_validate:
      type: string
      description: Uses wrong provider for validation
      resolve:
        with:
          - provider: static
            inputs:
              value: "test"
      validate:
        with:
          - provider: static
            inputs:
              value: "true"

    # empty-transform-with
    empty_transform:
      type: string
      description: Has empty transform
      resolve:
        with:
          - provider: static
            inputs:
              value: "raw"
      transform:
        with: []

    # empty-validate-with
    empty_validate:
      type: string
      description: Has empty validate
      resolve:
        with:
          - provider: static
            inputs:
              value: "raw"
      validate:
        with: []

    # permissive-result-schema (no constraints)
    loose_schema:
      type: string
      description: Result schema too loose
      resultSchema:
        type: string
      resolve:
        with:
          - provider: static
            inputs:
              value: "anything goes"

    # missing-description (another one)
    no_desc:
      type: string
      resolve:
        with:
          - provider: cel
            inputs:
              expression: "_.bad_provider + _.guarded"

    # orvalue-on-non-optional (concrete receiver, missing optional marker)
    bad_orvalue:
      type: string
      description: Calls orValue on a concrete (non-optional) value
      resolve:
        with:
          - provider: static
            inputs:
              value:
                expr: '__self.orValue("fallback")'

    # transform-shape-mismatch (transform accesses __self.body but static fallback returns [])
    shape_mismatch:
      description: Resolver with mismatched transform shape
      resolve:
        with:
          - provider: http
            when:
              expr: 'has(_.main_output)'
            inputs:
              url: https://api.example.com/data
          - provider: static
            inputs:
              value: []
      transform:
        with:
          - provider: cel
            inputs:
              expression: '__self.body.items'

    # template-unknown-accessor — bare "{{ .projcts }}" is a typo (no resolver,
    # data key, or forEach alias named "projcts"); it renders empty at runtime
    # instead of failing, so it is surfaced as a warning.
    typo_template:
      type: string
      description: Go template references an unknown root accessor
      resolve:
        with:
          - provider: go-template
            inputs:
              operation: render
              template: "Deploying {{ .projcts }}"

    # used resolver so not everything is unused
    main_output:
      type: string
      description: The main resolver
      dependsOn:
        - bad_provider
        - guarded
        - slow_call
        - wrong_validate
        - empty_transform
        - empty_validate
        - loose_schema
        - no_desc
        - bad_orvalue
        - typo_template
      resolve:
        with:
          - provider: static
            inputs:
              value: "done"

  workflow:
    actions:
      deploy:
        description: Deploy action
        steps:
          - provider: exec
            inputs:
              command: "echo $USER_INPUT"
