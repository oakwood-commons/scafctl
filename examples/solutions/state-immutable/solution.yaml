# =============================================================================
# Immutable Resolvers Example
# =============================================================================
# Demonstrates immutable state entries that lock values permanently after
# first write. This is useful for infrastructure identifiers (cluster IDs,
# deployment UUIDs, tenant keys) that must remain stable across all future
# runs.
#
# How it works:
#   - A resolver with immutable: true locks its resolved value in state
#     after the first execution.
#   - On subsequent runs, the resolver executes again and its value is
#     compared against the locked value. If different, execution fails.
#   - The only way to reset is scafctl state delete.
#
# Usage:
#   # First run -- provide deployment ID and region via CLI parameters
#   scafctl run resolver -f solution.yaml -r deployment_id=deploy-abc123 -r region=us-east-1
#
#   # Second run -- parameters replayed from state, immutable value verified
#   scafctl run resolver -f solution.yaml
#
#   # Inspect state to see immutable flag
#   scafctl state list --path state-immutable-demo.json
#
#   # Override region (mutable) -- works fine
#   scafctl run resolver -f solution.yaml -r region=eu-west-1
#
#   # Try overriding deployment_id (immutable) -- fails with mismatch error!
#   scafctl run resolver -f solution.yaml -r deployment_id=deploy-NEW
#
#   # Delete the immutable entry to start fresh
#   scafctl state delete --path state-immutable-demo.json --key deployment_id
#
# Lint check -- verify no immutable misconfigurations:
#   scafctl lint -f solution.yaml
# =============================================================================
apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: state-immutable-example
  version: 1.0.0
  description: Demonstrates immutable resolver state entries

state:
  enabled: true
  backend:
    provider: file
    inputs:
      path: "state-immutable-demo.json"

spec:
  resolvers:
    # =========================================================================
    # Immutable resolver -- locked after first write
    # =========================================================================
    # On first run, the parameter provider resolves the value (from -r flag).
    # The immutable flag causes the resolved value to be locked in state.
    # On subsequent runs, the resolver executes again (via parameter replay)
    # and its value is compared against the locked entry. If the values differ,
    # execution fails with an error. The value can never change unless you
    # manually delete the state entry.
    deployment_id:
      description: Unique deployment identifier (locked after first generation)
      type: string
      immutable: true
      resolve:
        with:
          - provider: parameter
            inputs:
              key: "deployment_id"

    # =========================================================================
    # Mutable resolver -- can be updated on each run
    # =========================================================================
    # This resolver is NOT immutable. Parameters are replayed from state,
    # but passing -r region=<value> always overrides the replayed value.
    # On the very first run with no parameter, the static default is used.
    region:
      description: Target deployment region (can be changed between runs)
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: "region"
          - provider: static
            inputs:
              value: "us-west-2"

    # =========================================================================
    # Computed resolver -- uses the immutable deployment_id
    # =========================================================================
    deployment_info:
      description: Summary combining locked deployment ID with current region
      type: string
      dependsOn: [deployment_id, region]
      resolve:
        with:
          - provider: static
            inputs:
              value:
                expr: "'Deployment ' + _.deployment_id + ' in ' + _.region"

  workflow:
    actions:
      show-deployment:
        description: Display deployment info with immutable ID
        provider: message
        inputs:
          message:
            expr: "_.deployment_info"
          type: success