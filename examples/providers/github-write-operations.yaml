# Prerequisites: scafctl auth login github
# Warning: Write operations modify real repositories. Use with care.
#
# Run: scafctl run solution -f examples/providers/github-write-operations.yaml

apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: github-write-operations-example
  displayName: GitHub Write Operations Example
  category: providers
  tags:
    - github
    - provider-example
  description: |
    GitHub provider write operations: issues, PRs, commits, branches, tags,
    releases, repo management, rulesets, and security settings.
    Commits are automatically GPG-signed via createCommitOnBranch.
    Write operations must be used in workflow actions, not resolvers.

spec:
  resolvers:
    # Safe read operation (default active example)
    branches:
      description: List branches (safe read operation)
      type: any
      resolve:
        with:
          - provider: github
            inputs:
              operation: list_branches
              owner: cli
              repo: cli


# ---------------------------------------------------------------------------
# WRITE OPERATIONS REFERENCE
# ---------------------------------------------------------------------------
# Write operations (create_issue, create_pull_request, create_commit,
# create_release, dispatch_workflow, add_collaborator, ...) must run as
# WORKFLOW ACTIONS, not resolvers -- the github provider's write-op guard
# rejects mutating operations in resolver context. Add a `workflow.actions`
# block and set `provider: github` with the desired `operation`. Examples:
#
#   workflow:
#     actions:
#       new-issue:
#         provider: github
#         inputs:
#           operation: create_issue
#           owner: my-org
#           repo: my-repo
#           title: "Bug: something is broken"
#           body: "Steps to reproduce..."
#           labels: [bug, priority/high]
#
#       new-pr:
#         provider: github
#         inputs:
#           operation: create_pull_request
#           owner: my-org
#           repo: my-repo
#           title: "feat: add new templates"
#           head: feature-branch
#           base: main
#
#       new-release:
#         provider: github
#         inputs:
#           operation: create_release
#           owner: my-org
#           repo: my-repo
#           tag_name: v1.0.0
#           name: "Release 1.0.0"
