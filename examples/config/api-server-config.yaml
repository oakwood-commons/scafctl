# scafctl API server configuration example
# All fields are optional — defaults are used when omitted.
apiServer:
  host: "127.0.0.1"   # use 0.0.0.0 to expose publicly
  port: 8080
  apiVersion: "v1"
  shutdownTimeout: "30s"
  requestTimeout: "60s"
  idleTimeout: "60s"          # keep-alive idle timeout
  maxHeaderBytes: 1048576     # 1 MB request header cap
  maxRequestSize: 10485760  # 10 MB
  maxConcurrent: 1000

  # DNS-rebinding protection: permitted Host header values.
  # An EMPTY list (the default) accepts any Host. Set this when exposing
  # the server. Supports wildcards such as "*.example.com" (subdomains
  # only, not the bare apex -- list that separately). Applies to
  # /v1/* only; /health and /metrics remain exempt for k8s probes.
  allowedHosts: []

  tls:
    enabled: false
    cert: ""
    key: ""

  cors:
    enabled: true
    allowedOrigins:
      - "*"
    allowedMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowedHeaders:
      - "Content-Type"
      - "Authorization"
      - "X-Request-ID"
    maxAge: 3600

  rateLimit:
    global:
      maxRequests: 100
      window: "1m"

  auth:
    azureOIDC:
      enabled: false
      tenantId: ""
      clientId: ""

  compression:
    level: 6

  audit:
    enabled: true

  tracing:
    enabled: false
