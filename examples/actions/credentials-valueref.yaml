# Prerequisites:
#   scafctl secrets set deploy-api-key "replace-with-api-key"
#   scafctl auth login github
#
# Preview safe placeholders without resolving credentials:
#   scafctl render solution -f examples/actions/credentials-valueref.yaml -o yaml
#   scafctl run solution -f examples/actions/credentials-valueref.yaml --dry-run -o json
#
# Run:
#   scafctl run solution -f examples/actions/credentials-valueref.yaml

apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: credentials-valueref
  version: 1.0.0
  displayName: Credential ValueRef Injection
  category: actions
  tags:
    - action
    - action-example
    - credentials
    - secrets
    - auth
  description: Inject secrets (scrt:) and auth tokens (tkn:) into top-level and nested inputs with automatic redaction

spec:
  calls:
    post_status:
      description: Send an authenticated deployment status webhook
      provider: http
      args:
        body:
          type: string
          required: true
      inputs:
        url: https://api.example.com/v1/deployments
        method: POST
        body:
          expr: _.args.body
        headers:
          Content-Type: application/json
          X-API-Key:
            scrt: deploy-api-key
          X-GitHub-Token:
            tkn:
              handler: github
              minValidFor: 5m

  resolvers:
    environment:
      description: Target deployment environment
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: env
          - provider: static
            inputs:
              value: staging

    github_auth_header:
      description: Formatted Authorization header built from a tkn ValueRef
      type: string
      sensitive: true
      resolve:
        with:
          - provider: static
            inputs:
              value:
                tkn: github
      transform:
        with:
          - provider: cel
            inputs:
              expression: '"Bearer " + __self'

  workflow:
    actions:
      announce:
        description: Log target environment before invoking webhook
        provider: message
        inputs:
          message:
            tmpl: "Preparing deployment status update for {{ .environment }}"
          type: info

      verify-endpoint:
        description: Verify API endpoint using sensitive resolver header and scrt ValueRef
        dependsOn:
          - announce
        provider: http
        inputs:
          url: https://api.example.com/v1/health
          method: GET
          headers:
            Authorization:
              rslvr: github_auth_header
            X-API-Key:
              scrt: deploy-api-key

      send-webhook:
        description: Post deployment status using parameterized call with nested scrt and tkn
        dependsOn:
          - verify-endpoint
        call: post_status
        args:
          body:
            tmpl: '{"environment":"{{ .environment }}","status":"ready"}'
