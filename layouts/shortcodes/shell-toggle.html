{{- $id := printf "bp-sh-%d" .Ordinal -}}
{{- $inner := replaceRE "</div>[ \t\r\n]+<div" "</div><div" (trim .Inner " \t\r\n") -}}
<div class="bp-shell-toggle" data-shell-toggle><div class="bp-shell-bar" role="tablist" aria-label="Shell syntax"><button type="button" class="bp-shell-btn is-active" id="{{ $id }}-tab-bash" role="tab" aria-selected="true" aria-controls="{{ $id }}-pane-bash" data-shell-target="bash">Bash</button><button type="button" class="bp-shell-btn" id="{{ $id }}-tab-powershell" role="tab" aria-selected="false" aria-controls="{{ $id }}-pane-powershell" tabindex="-1" data-shell-target="powershell">PowerShell</button></div>{{- $inner | safeHTML -}}</div>
