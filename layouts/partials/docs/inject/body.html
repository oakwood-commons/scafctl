<script>
(function () {
  'use strict';

  document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
    meta.setAttribute('content', '#071e3d');
  });

  var svgCopy = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  var svgCheck = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  document.querySelectorAll('.highlight').forEach(function (el) {
    var btn = document.createElement('button');
    btn.className = 'copy-button';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Copy code to clipboard');
    btn.innerHTML = svgCopy;

    btn.addEventListener('click', function () {
      var code = el.querySelector('pre code');
      if (!code) return;

      navigator.clipboard.writeText(code.textContent).then(function () {
        btn.innerHTML = svgCheck;
        btn.classList.add('copied');
        setTimeout(function () {
          btn.innerHTML = svgCopy;
          btn.classList.remove('copied');
        }, 2000);
      });
    });

    el.appendChild(btn);
  });

  function applyLatestReleaseTag(tag) {
    if (!tag || !/^v\d+\.\d+\.\d+$/.test(tag)) return;
    var ver = tag.slice(1);
    document.querySelectorAll('.highlight pre code').forEach(function (code) {
      if (code.textContent.indexOf('oakwood-commons/scafctl/releases/download/') === -1) return;
      var walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT, null);
      var node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue.indexOf('scafctl') !== -1 || /v?\d+\.\d+\.\d+/.test(node.nodeValue)) {
          node.nodeValue = node.nodeValue
            .replace(/\/releases\/download\/v\d+\.\d+\.\d+\//g, '/releases/download/' + tag + '/')
            .replace(/scafctl_\d+\.\d+\.\d+_/g, 'scafctl_' + ver + '_');
        }
      }
    });
  }

  var codeBlocks = document.querySelectorAll('.highlight pre code');
  var hasReleaseSnippet = Array.prototype.some.call(codeBlocks, function (c) {
    return c.textContent.indexOf('oakwood-commons/scafctl/releases/download/') !== -1;
  });
  if (hasReleaseSnippet) {
    var cacheKey = 'oc-latest:oakwood-commons/scafctl';
    var cached = null;
    try { cached = sessionStorage.getItem(cacheKey); } catch (_) {}
    if (cached) {
      applyLatestReleaseTag(cached);
    } else {
      fetch('https://api.github.com/repos/oakwood-commons/scafctl/releases/latest', {
        headers: { Accept: 'application/vnd.github+json' }
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var tag = d && typeof d.tag_name === 'string' ? d.tag_name.trim() : '';
          if (!tag) return;
          try { sessionStorage.setItem(cacheKey, tag); } catch (_) {}
          applyLatestReleaseTag(tag);
        })
        .catch(function () {});
    }
  }
})();
</script>
