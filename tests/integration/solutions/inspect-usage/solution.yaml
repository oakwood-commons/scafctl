apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: test-inspect-usage
  version: 1.0.0
  description: A registry-style solution routed by an 'action' parameter.
  usage:
    synopsis: Query and refresh a small registry index
    examples:
      - description: Refresh the index from live data
        command: scafctl run solution -r action=refresh

spec:
  resolvers:
    action:
      description: What the solution should do
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: action
              default: show

  workflow:
    actions:
      show:
        description: Display the registry summary
        when: '_.action == "show"'
        provider: message
        inputs:
          message: "SHOW_RAN"
          type: info
      refresh:
        description: Fetch fresh data and update the index
        when: '_.action == "refresh"'
        provider: message
        inputs:
          message: "REFRESH_RAN"
          type: info

  testing:
    cases:
      # The usage view (JSON) exposes synopsis, discovered allowed values, and
      # per-action run commands.
      usage-json:
        description: inspect solution --usage returns a structured usage view
        command: [inspect, solution]
        args: ["--usage", "-o", "json"]
        tags: [inspect, usage, smoke]
        assertions:
          - expression: __exitCode == 0
          - expression: __output.synopsis == "Query and refresh a small registry index"
            message: "Synopsis should come from metadata.usage"
          - expression: __output.parameters[0].name == "action"
          - expression: __output.parameters[0].default == "show"
          - expression: __output.parameters[0].allowedValues.exists(v, v == "refresh")
            message: "Allowed values should be discovered from action when-clauses"
          - expression: __output.parameters[0].allowedValues.exists(v, v == "show")
          - expression: __output.actions.exists(a, a.name == "refresh" && a.command.contains("action=refresh"))
            message: "Each action should carry the command that triggers it"

      # The default (human) usage view is readable text with the key sections.
      usage-text:
        description: inspect solution --usage default output is human-readable
        command: [inspect, solution]
        args: ["--usage"]
        tags: [inspect, usage]
        assertions:
          - expression: __exitCode == 0
          - expression: __stdout.contains("PARAMETERS")
          - expression: __stdout.contains("ACTIONS")
          - expression: __stdout.contains("-r action=refresh")
