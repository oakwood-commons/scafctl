apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: lint-tmpl-underscore
  version: 1.0.0
  description: |
    Tests that scafctl lint detects the {{ ._.resolverName }} syntax in Go
    templates and reports the tmpl-underscore-prefix rule as an informational
    finding. The underscore alias works at runtime but direct access is preferred.

spec:
  resolvers:
    config:
      description: Static config resolver
      resolve:
        with:
          - provider: static
            inputs:
              value:
                appName: my-app

    greeting:
      description: Greeting using underscore prefix (triggers informational lint finding)
      resolve:
        with:
          - provider: static
            inputs:
              value:
                tmpl: "Hello from {{ ._.config.appName }}"

  testing:
    config:
      # lint: solution intentionally has tmpl-underscore-prefix lint error
      # resolve-defaults: tmpl value is a literal string (not resolved as template here)
      skipBuiltins: [lint, resolve-defaults, render-defaults]

    cases:
      underscore-prefix-detected:
        description: Lint should report tmpl-underscore-prefix for ._.config usage
        command: [lint]
        args: ["-o", "json"]
        tags: [template, lint]
        assertions:
          - expression: __exitCode == 0
            message: "Info-level findings should not cause lint to fail"
          - expression: >
              __output.findings.exists(f, f.ruleName == "tmpl-underscore-prefix")
            message: "A tmpl-underscore-prefix finding should be present"

      underscore-prefix-severity:
        description: tmpl-underscore-prefix findings should have info severity
        command: [lint]
        args: ["-o", "json"]
        tags: [template, lint]
        assertions:
          - expression: >
              __output.findings.exists(f,
                f.ruleName == "tmpl-underscore-prefix" && f.severity == "info")
            message: "tmpl-underscore-prefix findings should have info severity"
          - expression: >
              __output.findings.exists(f,
                f.ruleName == "tmpl-underscore-prefix" && f.category == "template")
            message: "tmpl-underscore-prefix findings should have template category"

      underscore-prefix-suggestion:
        description: Finding should suggest replacing ._.config with .config
        command: [lint]
        args: ["-o", "json"]
        tags: [template, lint]
        assertions:
          - expression: >
              __output.findings.exists(f,
                f.ruleName == "tmpl-underscore-prefix" &&
                f.suggestion.contains(".config"))
            message: "Finding should suggest the correct syntax"
