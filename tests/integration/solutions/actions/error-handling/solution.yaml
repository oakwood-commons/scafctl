apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: test-action-error-handling
  version: 1.0.0
  description: |
    Functional tests for action error handling.
    Verifies onError continue/fail behavior, non-zero exit code capture,
    and dependency-failed skip propagation.

spec:
  resolvers:
    target:
      description: Deployment target
      resolve:
        with:
          - provider: static
            inputs:
              value: "test-env"

  workflow:
    actions:
      successAction:
        description: Action that succeeds
        provider: exec
        inputs:
          command: "echo success"

      nonZeroExit:
        description: Action with non-zero exit code detected via resultSchema
        provider: exec
        onError: continue
        resultSchema:
          type: object
          properties:
            exitCode:
              type: integer
              enum: [0]
        resultSchemaMode: error
        inputs:
          command: "sh -c 'exit 1'"

      afterNonZero:
        description: Runs after the non-zero exit action
        provider: exec
        dependsOn: [nonZeroExit]
        inputs:
          command: "echo after-nonzero"

      dependsOnSuccess:
        description: Depends on the successful action
        provider: exec
        dependsOn: [successAction]
        inputs:
          command: "echo after-success"

  testing:
    cases:
      _run-base:
        description: Base template for error handling tests
        command: [run, solution]
        args: ["-o", "json"]
        tags: [action, error-handling]
        assertions:
          - expression: __exitCode == 0

      nonzero-exit-captured:
        description: Verify non-zero exit code results in action failure
        extends: [_run-base]
        tags: [smoke]
        assertions:
          - expression: __output.actions["nonZeroExit"].status == "failed"
            message: "Action should have failed status"

      dependent-still-runs:
        description: Verify dependent action is skipped when dependency fails
        extends: [_run-base]
        assertions:
          - expression: __output.actions["afterNonZero"].status == "skipped"
            message: "Dependent action should be skipped when dependency fails"

      success-unaffected:
        description: Verify unrelated success path is unaffected
        extends: [_run-base]
        assertions:
          - expression: __output.actions["dependsOnSuccess"].status == "succeeded"
            message: "Independent success path should work"

      overall-status:
        description: Verify overall solution status reflects partial failure
        extends: [_run-base]
        assertions:
          - expression: __output.status == "partial-success"
            message: "Overall status should be partial-success when an action fails with onError=continue"
