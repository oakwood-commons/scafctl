apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: test-http-provider
  version: 1.0.0
  description: |
    Functional tests for the HTTP provider.
    Uses a mock HTTP server started via testConfig.services to verify
    GET, POST, custom headers, error status codes, and response parsing.

spec:
  resolvers:
    getUsers:
      description: GET request returning JSON
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/users'"
              method: GET
              headers:
                Accept: application/json

    postData:
      description: POST request with echo to verify request body
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/echo'"
              method: POST
              body: '{"action":"create","name":"test-item"}'
              headers:
                Content-Type: application/json

    postStructured:
      description: POST an object body serialized to JSON with defaulted Content-Type
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/echo'"
              method: POST
              autoParseJson: true
              body:
                expr: '{"action": "create", "name": "test-item"}'

    postStructuredArray:
      description: POST an array body serialized to JSON
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/echo'"
              method: POST
              autoParseJson: true
              body:
                expr: '["alpha", "beta", "gamma"]'

    notFoundEndpoint:
      description: GET request to non-existent endpoint
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/missing'"
              method: GET

    acceptable404:
      description: 404 treated as success via acceptableStatusCodes (exact codes)
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/missing'"
              method: GET
              autoParseJson: true
              acceptableStatusCodes: [200, 404]

    acceptable4xxClass:
      description: 404 treated as success via acceptableStatusCodes (class shorthand)
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/missing'"
              method: GET
              acceptableStatusCodes: ["2xx", "4xx"]

    acceptableStrictFallback:
      description: Unacceptable status fails the source, falling back to a static value
      resolve:
        with:
          - provider: http
            onError: continue
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/missing'"
              method: GET
              acceptableStatusCodes: [200]
          - provider: static
            inputs:
              value: fallback-value

    customHeaders:
      description: GET request with custom response headers
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/custom-headers'"
              method: GET

    healthCheck:
      description: GET request to the built-in health endpoint
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/__health'"
              method: GET

    autoParsedGet:
      description: GET with autoParseJson enabled
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/api/users'"
              method: GET
              autoParseJson: true

    pollEndpoint:
      description: Poll an endpoint until condition is met
      resolve:
        with:
          - provider: http
            inputs:
              url:
                expr: "_.mockBaseUrl + '/__health'"
              method: GET
              autoParseJson: true
              poll:
                until: 'statusCode == 200'
                interval: 1s
                maxAttempts: 3

    mockBaseUrl:
      description: Base URL of mock server from env
      resolve:
        with:
          - provider: env
            inputs:
              operation: get
              name: MOCK_BASE_URL
      transform:
        with:
          - provider: cel
            inputs:
              expression: "__self.value"

  testing:
    config:
      # resolve-defaults: resolvers depend on MOCK_BASE_URL env var and moc  resolvers
      skipBuiltins: [resolve-defaults]
      services:
        - name: mock-api
          type: http
          portEnv: MOCK_HTTP_PORT
          baseUrlEnv: MOCK_BASE_URL
          routes:
            - path: /api/users
              method: GET
              status: 200
              body: '{"users":[{"id":1,"name":"alice"},{"id":2,"name":"bob"}]}'
              headers:
                Content-Type: application/json
            - path: /api/echo
              method: POST
              status: 201
              echo: true
            - path: /api/missing
              method: GET
              status: 404
              body: '{"error":"not found"}'
              headers:
                Content-Type: application/json
            - path: /api/custom-headers
              method: GET
              status: 200
              body: ok
              headers:
                Content-Type: text/plain
                X-Custom-Header: custom-value
                X-Request-Id: req-12345

    cases:
      _base:
        description: Base template for HTTP provider tests
        command: [run, resolver]
        args: ["-o", "json", "--config", "config.yaml"]
        tags: [provider, http]
        # Write a per-sandbox scafctl config that allows private IPs so the mock
        # HTTP server (127.0.0.1) is reachable during tests.
        init:
          - command: "printf 'httpClient:\\n  allowPrivateIPs: true\\n' > config.yaml"
        assertions:
          - expression: __exitCode == 0

      get-json-response:
        description: Verify GET request returns parsed JSON body
        extends: [_base]
        tags: [smoke]
        assertions:
          - expression: __output.getUsers.body.contains("alice")
            message: "GET /api/users should contain alice"
          - expression: __output.getUsers.statusCode == 200
            message: "Status code should be 200"

      post-echo-body:
        description: Verify POST request echoes back the request body and method
        extends: [_base]
        assertions:
          - expression: __output.postData.statusCode == 201
            message: "POST /api/echo should return 201"
          - expression: __output.postData.body.contains("create")
            message: "Echo response should contain the posted body content"
          - expression: __output.postData.body.contains("POST")
            message: "Echo response should contain the HTTP method"

      post-structured-object-body:
        description: Verify an object body is serialized to JSON with a defaulted Content-Type
        extends: [_base]
        assertions:
          - expression: __output.postStructured.body.body.contains("\"action\":\"create\"")
            message: "Object body should be serialized to compact JSON"
          - expression: __output.postStructured.body.body.contains("\"name\":\"test-item\"")
            message: "Serialized JSON should include all fields"
          - expression: __output.postStructured.body.headers["Content-Type"] == "application/json"
            message: "Content-Type should default to application/json for a structured body"

      post-structured-array-body:
        description: Verify an array body is serialized to JSON
        extends: [_base]
        assertions:
          - expression: __output.postStructuredArray.body.body == "[\"alpha\",\"beta\",\"gamma\"]"
            message: "Array body should be serialized to compact JSON"
          - expression: __output.postStructuredArray.body.headers["Content-Type"] == "application/json"
            message: "Content-Type should default to application/json for an array body"

      not-found-response:
        description: Verify 404 response from missing endpoint
        extends: [_base]
        assertions:
          - expression: __output.notFoundEndpoint.statusCode == 404
            message: "Missing endpoint should return 404"
          - expression: __output.notFoundEndpoint.body.contains("not found")
            message: "404 body should contain error message"
          - expression: __output.notFoundEndpoint.success == false
            message: "404 is not successful by default (only 2xx)"

      acceptable-status-codes-exact:
        description: Verify acceptableStatusCodes lets an exact 404 count as success
        extends: [_base]
        tags: [acceptableStatusCodes]
        assertions:
          - expression: __output.acceptable404.statusCode == 404
            message: "Endpoint should return 404"
          - expression: __output.acceptable404.success == true
            message: "404 should be successful when listed in acceptableStatusCodes"
          - expression: __output.acceptable404.body.error == "not found"
            message: "Body should still be parsed when status is acceptable"

      acceptable-status-codes-class:
        description: Verify acceptableStatusCodes class shorthand (4xx) counts as success
        extends: [_base]
        tags: [acceptableStatusCodes]
        assertions:
          - expression: __output.acceptable4xxClass.statusCode == 404
          - expression: __output.acceptable4xxClass.success == true
            message: "404 should be successful when 4xx is acceptable"

      acceptable-status-codes-fallback:
        description: Verify an unacceptable status fails the source and falls back
        extends: [_base]
        tags: [acceptableStatusCodes]
        assertions:
          - expression: '__output.acceptableStrictFallback == "fallback-value"'
            message: "Unacceptable 404 should fail and fall back to the static value"

      custom-response-headers:
        description: Verify custom response headers are returned
        extends: [_base]
        assertions:
          - expression: __output.customHeaders.statusCode == 200
          - expression: __output.customHeaders.headers["X-Custom-Header"] == "custom-value"
            message: "Custom header should be present"
          - expression: __output.customHeaders.headers["X-Request-Id"] == "req-12345"
            message: "Request ID header should be present"

      health-endpoint:
        description: Verify mock server health endpoint
        extends: [_base]
        assertions:
          - expression: __output.healthCheck.statusCode == 200
            message: "Health endpoint should return 200"

      autoparse-json:
        description: Verify autoParseJson parses response body into structured data
        extends: [_base]
        tags: [autoParseJson]
        assertions:
          - expression: __output.autoParsedGet.statusCode == 200
          - expression: type(__output.autoParsedGet.body) != type("")
            message: "Body should be parsed object, not string"
          - expression: size(__output.autoParsedGet.body.users) == 2
            message: "Should have 2 users in parsed body"
          - expression: __output.autoParsedGet.body.users[0].name == "alice"
            message: "First user should be alice"

      poll-until-success:
        description: Verify poll executes until condition is met
        extends: [_base]
        tags: [poll]
        assertions:
          - expression: __output.pollEndpoint.statusCode == 200
            message: "Poll should succeed with 200"
