apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: test-solution-provider-workflow
  version: 1.0.0
  description: |
    Functional tests for composed workflows via the solution provider.
    Verifies explicit action exclusion, dependsOn closure, finally execution,
    prefixed progress reporting, and action-envelope output for resolver-only children.

spec:
  resolvers:
    targetEnv:
      type: string
      description: Target environment passed to child solution
      resolve:
        with:
          - provider: static
            inputs:
              value: "staging"

  workflow:
    actions:
      runChildWorkflow:
        description: Execute child workflow via solution provider
        provider: solution
        inputs:
          source: "./child.yaml"
          inputs:
            env:
              rslvr: targetEnv

      runResolverOnlyChild:
        description: Execute resolver-only child in action mode
        provider: solution
        inputs:
          source: "./resolver-only-child.yaml"

      checkPrepExists:
        description: Verify explicit dependency action ran
        dependsOn: [runChildWorkflow]
        provider: file
        inputs:
          operation: exists
          path: ./prep.txt

      checkBuildContent:
        description: Verify non-explicit build action ran with parent input
        dependsOn: [runChildWorkflow]
        provider: file
        inputs:
          operation: read
          path: ./build.txt

      checkOptionalSkipped:
        description: Verify standalone explicit action did not run
        dependsOn: [runChildWorkflow]
        provider: file
        inputs:
          operation: exists
          path: ./optional.txt

      checkFinallyExists:
        description: Verify child finally action ran
        dependsOn: [runChildWorkflow]
        provider: file
        inputs:
          operation: exists
          path: ./finally.txt

      runTargetedChild:
        description: Execute explicit child target action via alias with resolver scoping
        explicit: true
        provider: solution
        inputs:
          source: "./child.yaml"
          actions:
            - deploy
          inputs:
            env: "prod"
            unusedMode: "fail"

      checkTargetedPrep:
        description: Verify transitive dependsOn prep action ran for targeted child
        explicit: true
        dependsOn: [runTargetedChild]
        provider: file
        inputs:
          operation: read
          path: ./prep.txt

      checkTargetedDeploy:
        description: Verify targeted explicit action ran via alias
        explicit: true
        dependsOn: [runTargetedChild]
        provider: file
        inputs:
          operation: read
          path: ./targeted-deploy.txt

      checkTargetedBuildSkipped:
        description: Verify unselected non-explicit build action did not run
        explicit: true
        dependsOn: [runTargetedChild]
        provider: file
        inputs:
          operation: exists
          path: ./build.txt

      checkTargetedFinally:
        description: Verify child finally action still ran under targeted execution
        explicit: true
        dependsOn: [runTargetedChild]
        provider: file
        inputs:
          operation: exists
          path: ./finally.txt

      verifyTargetedRun:
        description: Aggregate target for verifying selective child action execution
        explicit: true
        dependsOn:
          - checkTargetedPrep
          - checkTargetedDeploy
          - checkTargetedBuildSkipped
          - checkTargetedFinally
        provider: message
        inputs:
          message: "targeted-child-verified"

      runUnknownActionSoft:
        description: Verify unknown child action target produces failed _workflow envelope when propagateErrors is false
        explicit: true
        provider: solution
        inputs:
          source: "./child.yaml"
          actions:
            - nonexistent
          propagateErrors: false
          inputs:
            unusedMode: "fail"

      runWorkflowlessTargetedSoft:
        description: Verify targeting actions on a workflow-less child produces failed _workflow envelope when propagateErrors is false
        explicit: true
        provider: solution
        inputs:
          source: "./resolver-only-child.yaml"
          actions:
            - deploy
          propagateErrors: false

  testing:
    cases:
      composed-workflow-explicit-and-finally:
        description: Verify composed child workflow excludes standalone explicit actions, keeps dependsOn closure, runs finally, and prefixes progress
        command: [run, solution]
        args: ["-o", "json"]
        tags: [provider, solution-provider, action, smoke]
        files: ["child.yaml", "resolver-only-child.yaml"]
        assertions:
          - expression: __exitCode == 0
          - expression: __output.status == "succeeded"
          - expression: __output.actions["runChildWorkflow"].results.success == true
          - expression: __output.actions["runChildWorkflow"].results.workflow.finalStatus == "succeeded"
          - expression: __output.actions["checkPrepExists"].results.exists == true
            message: "Explicit child action depended on by non-explicit action must run"
          - expression: __output.actions["checkBuildContent"].results.content == "build:staging"
            message: "Non-explicit child action must run and receive parent input"
          - expression: __output.actions["checkOptionalSkipped"].results.exists == false
            message: "Standalone explicit child action must not run when composed"
          - expression: __output.actions["checkFinallyExists"].results.exists == true
            message: "Child finally action must run"
          - expression: __output.actions["runResolverOnlyChild"].results.success == true
            message: "Resolver-only child in action mode must return action envelope with success boolean"
          - expression: __output.actions["runResolverOnlyChild"].results.resolvers.token == "from-resolver-only-child"
          - expression: __stderr.contains("[solution:")
            message: "Child action progress must be prefixed with [solution:<name>]"
          - expression: __stderr.contains("] prep:")
          - expression: __stderr.contains("] build:")
          - expression: "!__stderr.contains(\"] optionalDeploy\")"

      targeted-explicit-alias-and-resolver-scoping:
        description: Verify actions input runs targeted explicit action via alias plus dependsOn closure and finally while scoping child resolvers
        command: [run, solution]
        args: ["--action", "verifyTargetedRun", "-o", "json"]
        tags: [provider, solution-provider, action]
        files: ["child.yaml", "resolver-only-child.yaml"]
        assertions:
          - expression: __exitCode == 0
          - expression: __output.status == "succeeded"
          - expression: __output.actions["runTargetedChild"].results.success == true
          - expression: __output.actions["runTargetedChild"].results.workflow.finalStatus == "succeeded"
          - expression: __output.actions["runTargetedChild"].results.resolvers.env == "prod"
          - expression: '!("unusedCheck" in __output.actions["runTargetedChild"].results.resolvers)'
            message: "Unreferenced child resolver must be skipped when actions scopes execution"
          - expression: __output.actions["checkTargetedPrep"].results.content == "prep:prod"
            message: "Transitive explicit dependency of targeted child action must run"
          - expression: __output.actions["checkTargetedDeploy"].results.content == "deploy:prod"
            message: "Targeted explicit child action must run via its alias"
          - expression: __output.actions["checkTargetedBuildSkipped"].results.exists == false
            message: "Unselected non-explicit child action must not run when actions is specified"
          - expression: __output.actions["checkTargetedFinally"].results.exists == true
            message: "Child finally action must always run"

      targeted-unknown-action-soft-error:
        description: Verify unknown child target action reports _workflow error in failed envelope without running child resolvers
        command: [run, solution]
        args: ["--action", "runUnknownActionSoft", "-o", "json"]
        tags: [provider, solution-provider, action]
        files: ["child.yaml", "resolver-only-child.yaml"]
        assertions:
          - expression: __exitCode == 0
          - expression: __output.actions["runUnknownActionSoft"].results.success == false
          - expression: __output.actions["runUnknownActionSoft"].results.status == "failed"
          - expression: size(__output.actions["runUnknownActionSoft"].results.errors) == 1
          - expression: __output.actions["runUnknownActionSoft"].results.errors[0].resolver == "_workflow"
          - expression: __output.actions["runUnknownActionSoft"].results.errors[0].message.contains("not found in workflow")

      targeted-workflowless-child-soft-error:
        description: Verify targeting actions on a workflow-less child reports _workflow error in failed envelope
        command: [run, solution]
        args: ["--action", "runWorkflowlessTargetedSoft", "-o", "json"]
        tags: [provider, solution-provider, action]
        files: ["child.yaml", "resolver-only-child.yaml"]
        assertions:
          - expression: __exitCode == 0
          - expression: __output.actions["runWorkflowlessTargetedSoft"].results.success == false
          - expression: __output.actions["runWorkflowlessTargetedSoft"].results.status == "failed"
          - expression: size(__output.actions["runWorkflowlessTargetedSoft"].results.errors) == 1
          - expression: __output.actions["runWorkflowlessTargetedSoft"].results.errors[0].resolver == "_workflow"
          - expression: __output.actions["runWorkflowlessTargetedSoft"].results.errors[0].message.contains("has no workflow defined")

      targeted-dry-run-whatif:
        description: Verify dry-run WhatIf description includes selected child action names
        command: [run, solution]
        args: ["--action", "runTargetedChild", "--dry-run", "-o", "json"]
        tags: [provider, solution-provider, action]
        files: ["child.yaml", "resolver-only-child.yaml"]
        assertions:
          - expression: __exitCode == 0
          - expression: __output.dryRun == true
          - expression: '__output.actionPlan[0].wouldDo.contains("(actions: deploy)")'
