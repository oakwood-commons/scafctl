apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: test-parameter-provider
  version: 1.0.0
  description: |
    Functional tests for the parameter provider.
    Verifies CLI parameter passing via -r flag, type coercion,
    fallback chains, and various value formats.

spec:
  resolvers:
    stringParam:
      description: String parameter
      resolve:
        with:
          - provider: parameter
            inputs:
              key: name

    intParam:
      description: Integer parameter
      type: int
      resolve:
        with:
          - provider: parameter
            inputs:
              key: count

    boolParam:
      description: Boolean parameter
      type: bool
      resolve:
        with:
          - provider: parameter
            inputs:
              key: enabled

    jsonParam:
      description: JSON object parameter
      resolve:
        with:
          - provider: parameter
            inputs:
              key: config

    csvParam:
      description: CSV list parameter (opt in with type csv; auto no longer splits)
      resolve:
        with:
          - provider: parameter
            inputs:
              key: tags
              type: csv

    paramWithDefault:
      description: Parameter with static fallback
      resolve:
        with:
          - provider: parameter
            onError: continue
            inputs:
              key: optional
          - provider: static
            inputs:
              value: default-value

    missingParam:
      description: Missing parameter triggers fallback
      resolve:
        with:
          - provider: parameter
            onError: continue
            inputs:
              key: does-not-exist
          - provider: static
            inputs:
              value: fallback-used

    verbatimString:
      description: Numeric-looking value forced to stay a string (type string)
      resolve:
        with:
          - provider: parameter
            inputs:
              key: billingId
              default: "00042"
              type: string

    coercedNumber:
      description: Same value with default type inference (becomes a number)
      resolve:
        with:
          - provider: parameter
            inputs:
              key: billingId
              default: 42

    rawValue:
      description: type raw returns the value untouched (no coercion or unquoting)
      resolve:
        with:
          - provider: parameter
            inputs:
              key: rawId
              type: raw
              default: "0055"

    floatValue:
      description: type float forces floating-point parsing
      resolve:
        with:
          - provider: parameter
            inputs:
              key: ratio
              type: float
              default: 1.5

    jsonValue:
      description: type json forces JSON parsing of the raw value
      resolve:
        with:
          - provider: parameter
            inputs:
              key: settings
              type: json
              default: '{"replicas":1}'

    strictInt:
      description: type int forces integer parsing and errors on a non-integer value
      resolve:
        with:
          - provider: parameter
            inputs:
              key: strictCount
              type: int
              default: 3

  testing:
    config:
      # resolve-defaults: resolvers use parameter provider requiring external -r flag input
      skipBuiltins: [resolve-defaults]

    cases:
      _base:
        description: Base template for parameter provider tests
        command: [run, resolver]
        args: ["-o", "json"]
        tags: [provider, parameter]
        assertions:
          - expression: __exitCode == 0

      string-parameter:
        description: Verify string parameter passed via -r flag
        extends: [_base]
        tags: [smoke]
        args: ["-o", "json", "-r", "name=hello-world", "-r", "count=10", "-r", "enabled=true", "-r", "config={\"key\":\"val\"}", "-r", "tags=a,b,c"]
        assertions:
          - expression: __output.stringParam == "hello-world"
            message: "String parameter should resolve correctly"

      integer-parameter:
        description: Verify integer parameter with type coercion
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=42", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a"]
        assertions:
          - expression: __output.intParam == 42
            message: "Integer parameter should be coerced to int"

      boolean-parameter:
        description: Verify boolean parameter with type coercion
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=true", "-r", "config={}", "-r", "tags=a"]
        assertions:
          - expression: __output.boolParam == true
            message: "Boolean parameter should be coerced to bool"

      param-with-default:
        description: Verify missing parameter falls through to static default
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a"]
        assertions:
          - expression: __output.paramWithDefault == "default-value"
            message: "Missing optional parameter should use fallback"

      missing-param-fallback:
        description: Verify completely missing parameter uses fallback
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a"]
        assertions:
          - expression: __output.missingParam == "fallback-used"
            message: "Non-existent parameter should trigger fallback chain"

      string-type-default:
        description: Verify type string returns the default verbatim (no coercion)
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a"]
        assertions:
          - expression: __output.verbatimString == "00042"
            message: "type string default should stay a verbatim string with leading zeros"

      string-type-suppresses-coercion:
        description: Verify type string keeps a numeric value as a string while default inference coerces it
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a", "-r", "billingId=12345"]
        assertions:
          - expression: __output.verbatimString == "12345"
            message: "type string should keep the numeric value as a string"
          - expression: __output.coercedNumber == 12345
            message: "without type string the same value should be coerced to a number"

      csv-parameter:
        description: Verify type csv splits a comma-separated value into a string list
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a,b,c"]
        assertions:
          - expression: __output.csvParam == ["a", "b", "c"]
            message: "type csv should split the comma-separated value into a trimmed list"

      csv-auto-no-split:
        description: Verify auto inference no longer splits comma-separated values (breaking change)
        extends: [_base]
        args: ["-o", "json", "-r", "name=a,b,c", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=x"]
        assertions:
          - expression: __output.stringParam == "a,b,c"
            message: "auto inference should keep a comma-separated value as a literal string"

      raw-parameter:
        description: Verify type raw returns the value exactly as provided
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a", "-r", "rawId=0055"]
        assertions:
          - expression: __output.rawValue == "0055"
            message: "type raw should return the value untouched, preserving leading zeros"

      float-parameter:
        description: Verify type float parses a floating-point value
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a", "-r", "ratio=2.75"]
        assertions:
          - expression: __output.floatValue == 2.75
            message: "type float should coerce the value to a float"

      json-parameter:
        description: Verify type json parses the raw value into a structured object
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a", "-r", "settings={\"replicas\":3}"]
        assertions:
          - expression: __output.jsonValue.replicas == 3
            message: "type json should parse the value into a map with accessible fields"

      typed-int-valid:
        description: Verify type int coerces a valid integer value
        extends: [_base]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a", "-r", "strictCount=7"]
        assertions:
          - expression: __output.strictInt == 7
            message: "type int should coerce a valid integer value"

      typed-int-error:
        description: Verify type int errors on a non-integer value instead of silently coercing
        command: [run, resolver]
        tags: [provider, parameter]
        args: ["-o", "json", "-r", "name=x", "-r", "count=1", "-r", "enabled=false", "-r", "config={}", "-r", "tags=a", "-r", "strictCount=abc"]
        assertions:
          - expression: __exitCode != 0
            message: "type int should fail the run when the value cannot be parsed as an integer"

