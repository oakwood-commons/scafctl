apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: test-file-provider
  version: 1.0.0
  description: Tests for the file provider

spec:
  resolvers:
    readFixture:
      description: Read a fixture file
      resolve:
        with:
          - provider: file
            inputs:
              operation: read
              path: ./test-fixture.txt

    fileExists:
      description: Check if a file exists
      resolve:
        with:
          - provider: file
            inputs:
              operation: exists
              path: ./test-fixture.txt

    fileNotExists:
      description: Check if a non-existent file exists
      resolve:
        with:
          - provider: file
            inputs:
              operation: exists
              path: ./this-file-does-not-exist.txt

    readJson:
      description: Read a JSON fixture file
      resolve:
        with:
          - provider: file
            inputs:
              operation: read
              path: ./test-data.json

    parseJson:
      description: Read and parse a JSON fixture file into a structured object
      resolve:
        with:
          - provider: file
            inputs:
              operation: read
              path: ./test-data.json
              parse: json

    parseYaml:
      description: Read and parse a YAML fixture into a structured object (JSON is valid YAML)
      resolve:
        with:
          - provider: file
            inputs:
              operation: read
              path: ./test-data.json
              parse: yaml

    parseAuto:
      description: Read and auto-parse a fixture, selecting the decoder by file extension
      resolve:
        with:
          - provider: file
            inputs:
              operation: read
              path: ./test-data.json
              parse: auto

  testing:
    config:
      # resolve-defaults: resolvers read fixture files that only exist via test init steps
      skipBuiltins: [resolve-defaults]

    cases:
      _base:
        description: Base template for file provider tests
        command: [run, resolver]
        args: ["-o", "json"]
        tags: [provider, file]
        assertions:
          - expression: __exitCode == 0

      read-fixture:
        description: Verify reading a file
        extends: [_base]
        tags: [smoke]
        init:
          - command: "echo -n 'fixture-content' > test-fixture.txt"
          - command: 'echo -n ''{"key":"value","count":42}'' > test-data.json'
        cleanup:
          - command: "rm -f test-fixture.txt test-data.json"
        assertions:
          - expression: '__output.readFixture.content == "fixture-content"'
            message: "Should read the fixture file content"

      file-exists:
        description: Verify file exists check returns true
        extends: [_base]
        init:
          - command: "echo -n 'exists' > test-fixture.txt"
          - command: "echo -n '{}' > test-data.json"
        cleanup:
          - command: "rm -f test-fixture.txt test-data.json"
        assertions:
          - expression: __output.fileExists.exists == true
            message: "Existing file should return true"

      file-not-exists:
        description: Verify file exists check returns false
        extends: [_base]
        init:
          - command: "echo -n 'needed' > test-fixture.txt"
          - command: "echo -n '{}' > test-data.json"
        cleanup:
          - command: "rm -f test-fixture.txt test-data.json"
        assertions:
          - expression: __output.fileNotExists.exists == false
            message: "Non-existent file should return false"

      read-json-content:
        description: Verify reading JSON file content
        extends: [_base]
        init:
          - command: "echo -n 'dummy' > test-fixture.txt"
          - command: 'echo -n ''{"key":"value","count":42}'' > test-data.json'
        cleanup:
          - command: "rm -f test-fixture.txt test-data.json"
        assertions:
          - expression: '__output.readJson.content.contains("key")'
          - expression: '__output.readJson.content.contains("value")'

      parse-json-object:
        description: Verify parse:json returns a structured object alongside raw content
        extends: [_base]
        init:
          - command: "echo -n 'dummy' > test-fixture.txt"
          - command: 'echo -n ''{"key":"value","count":42}'' > test-data.json'
        cleanup:
          - command: "rm -f test-fixture.txt test-data.json"
        assertions:
          - expression: '__output.parseJson.object.key == "value"'
            message: "Parsed object should expose nested fields"
          - expression: '__output.parseJson.object.count == 42'
            message: "Parsed object should preserve numeric values"
          - expression: '__output.parseJson.content.contains("key")'
            message: "Raw content should still be present alongside object"

      parse-yaml-object:
        description: Verify parse:yaml returns a structured object
        extends: [_base]
        init:
          - command: "echo -n 'dummy' > test-fixture.txt"
          - command: 'echo -n ''{"key":"value","count":42}'' > test-data.json'
        cleanup:
          - command: "rm -f test-fixture.txt test-data.json"
        assertions:
          - expression: '__output.parseYaml.object.key == "value"'
            message: "Parsed YAML object should expose mapping fields"
          - expression: '__output.parseYaml.object.count == 42'
            message: "Parsed YAML object should preserve numeric values"

      parse-auto-by-extension:
        description: Verify parse:auto selects the decoder from the .json extension
        extends: [_base]
        init:
          - command: "echo -n 'dummy' > test-fixture.txt"
          - command: 'echo -n ''{"key":"value","count":42}'' > test-data.json'
        cleanup:
          - command: "rm -f test-fixture.txt test-data.json"
        assertions:
          - expression: '__output.parseAuto.object.key == "value"'
            message: "auto should parse the .json fixture into an object"
          - expression: '__output.parseAuto.object.count == 42'
            message: "auto should expose numeric fields"



