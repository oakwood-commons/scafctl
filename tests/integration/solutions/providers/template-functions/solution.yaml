apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: template-functions-test
  version: 1.0.0
  description: Integration test for custom Go template functions
  category: test

spec:
  resolvers:
    project-name:
      resolve:
        with:
          - provider: static
            inputs:
              value: "My Cool Project! (v2)"

    services:
      resolve:
        with:
          - provider: static
            inputs:
              value:
                - name: api-gateway
                  port: 8080
                  active: true
                - name: auth-service
                  port: 8081
                  active: true
                - name: legacy-proxy
                  port: 9090
                  active: false

    metadata:
      resolve:
        with:
          - provider: static
            inputs:
              value:
                name: my-solution
                tags:
                  - alpha
                  - beta
                database:
                  host: db.example.com
                  port: 5432

    # slugify test
    slugified:
      dependsOn: [project-name]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ slugify (index . "project-name") }}'
              name: slugify-test

    # toDnsString test
    dns-label:
      dependsOn: [project-name]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ toDnsString (index . "project-name") }}'
              name: dns-test

    # where test
    active-services:
      dependsOn: [services]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: cel
            inputs:
              expression: '_.services.filter(s, s.active == true)'

    # selectField test
    service-names:
      dependsOn: [services]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ selectField "name" .services | toYaml }}'
              name: select-test

    # selectField on a map (existence check + dotted path)
    has-tags:
      dependsOn: [metadata]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ if .metadata | selectField "tags" }}yes{{ else }}no{{ end }}'
              name: select-map-exists-test

    db-host:
      dependsOn: [metadata]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ .metadata | selectField "database.host" | first }}'
              name: select-map-dotted-test

    # cel inline test
    active-count:
      dependsOn: [services]
      resolve:
        with:
          - provider: static
            inputs:
              value: placeholder
      transform:
        with:
          - provider: go-template
            inputs:
              template: '{{ cel "string(size(_.services.filter(s, s.active == true)))" . }}'
              name: cel-inline-test

  testing:
    cases:
      test-slugify:
        description: Verify slugify produces correct slug
        command: [run, resolver]
        args: ["-o", "json"]
        assertions:
          - expression: __exitCode == 0
          - expression: __output.slugified == "my-cool-project-v2"
            message: "slugify should produce correct slug"

      test-dns-string:
        description: Verify toDnsString produces correct DNS label
        command: [run, resolver]
        args: ["-o", "json"]
        assertions:
          - expression: __exitCode == 0
          - expression: __output["dns-label"] == "my-cool-project-v2"
            message: "toDnsString should produce correct DNS label"

      test-active-count:
        description: Verify cel inline counts active services
        command: [run, resolver]
        args: ["-o", "json"]
        assertions:
          - expression: __exitCode == 0
          - expression: __output["active-count"] == "2"
            message: "cel inline should count active services"

      test-service-names:
        description: Verify selectField extracts service names
        command: [run, resolver]
        args: ["-o", "json"]
        assertions:
          - expression: __exitCode == 0
          - expression: '__output["service-names"].contains("api-gateway")'
            message: "selectField should extract api-gateway"
          - expression: '__output["service-names"].contains("legacy-proxy")'
            message: "selectField should extract legacy-proxy"

      test-select-map-exists:
        description: Verify selectField on a map works as an existence check
        command: [run, resolver]
        args: ["-o", "json"]
        assertions:
          - expression: __exitCode == 0
          - expression: '__output["has-tags"] == "yes"'
            message: "selectField on a map should detect the present key"

      test-select-map-dotted:
        description: Verify selectField on a map supports dotted key paths
        command: [run, resolver]
        args: ["-o", "json"]
        assertions:
          - expression: __exitCode == 0
          - expression: '__output["db-host"] == "db.example.com"'
            message: "selectField should descend a dotted path into a nested map"

