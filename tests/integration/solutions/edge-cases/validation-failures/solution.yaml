apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: test-validation-failures
  version: 1.0.0
  description: Tests for validation failure behavior

spec:
  resolvers:
    validValue:
      description: A value that passes validation
      resolve:
        with:
          - provider: static
            inputs:
              value: "good"
      validate:
        with:
          - provider: validation
            inputs:
              match: "^[a-z]+$"
            message: "Must be lowercase letters"

    invalidRegex:
      description: A value that fails regex validation
      resolve:
        with:
          - provider: static
            inputs:
              value: "BAD_VALUE!"
      validate:
        with:
          - provider: validation
            inputs:
              match: "^[a-z]+$"
            message: "Must be lowercase letters only"

    invalidExpression:
      description: A value that fails CEL expression validation
      type: int
      resolve:
        with:
          - provider: static
            inputs:
              value: 999
      validate:
        with:
          - provider: validation
            inputs:
              expression: "__self >= 1 && __self <= 100"
            message: "Value must be between 1 and 100"

    invalidNotMatch:
      description: A value that fails notMatch validation
      resolve:
        with:
          - provider: static
            inputs:
              value: "has spaces in it"
      validate:
        with:
          - provider: validation
            inputs:
              notMatch: "\\s"
            message: "Value must not contain spaces"

    dependentOfInvalid:
      description: >
        Depends on invalidRegex, which fails validation only. Because
        validation is non-fatal in `run resolver`, invalidRegex still produces
        a usable value, so this dependent must still resolve.
      dependsOn: [invalidRegex]
      resolve:
        with:
          - provider: static
            inputs:
              value: ignored
      transform:
        with:
          - provider: cel
            inputs:
              expression: '_.invalidRegex + "-derived"'

  testing:
    config:
      # resolve-defaults: resolvers have intentional validation failures by design
      skipBuiltins: [resolve-defaults]

    cases:
      valid-passes:
        description: Verify valid value passes validation
        command: [run, resolver]
        args: ["validValue", "-o", "json"]
        tags: [edge-case, validation, smoke]
        assertions:
          - expression: __exitCode == 0
          - expression: '__output.validValue == "good"'

      regex-failure:
        description: Verify regex validation failure exits non-zero with --fail-on-validation
        command: [run, resolver]
        args: ["invalidRegex", "--fail-on-validation"]
        tags: [edge-case, validation, negative]
        expectFailure: true
        assertions:
          - expression: __exitCode != 0
            message: "Should fail validation"

      regex-failure-non-fatal:
        description: Verify regex validation failure is non-fatal by default (value still shown)
        command: [run, resolver]
        args: ["invalidRegex", "-o", "json"]
        tags: [edge-case, validation]
        assertions:
          - expression: __exitCode == 0
            message: "run resolver must be non-fatal by default"
          - expression: '__output.invalidRegex == "BAD_VALUE!"'
            message: "Partial value must still be shown despite validation failure"
          - expression: '__stderr.contains("failed validation")'
            message: "Validation diagnostics must appear on stderr"

      dependent-of-validation-failure-still-runs:
        description: >
          A dependent of a validation-only failure still resolves -- non-fatal
          validation keeps dependents running because the upstream value is usable.
        command: [run, resolver]
        args: ["dependentOfInvalid", "-o", "json"]
        tags: [edge-case, validation]
        assertions:
          - expression: __exitCode == 0
            message: "run resolver must be non-fatal by default"
          - expression: '__output.dependentOfInvalid == "BAD_VALUE!-derived"'
            message: "Dependent of a validation-only failure must still resolve using the upstream value"

      expression-failure:
        description: Verify CEL expression validation failure exits non-zero with --fail-on-validation
        command: [run, resolver]
        args: ["invalidExpression", "--fail-on-validation"]
        tags: [edge-case, validation, negative]
        expectFailure: true
        assertions:
          - expression: __exitCode != 0
            message: "Should fail validation"

      not-match-failure:
        description: Verify notMatch validation failure exits non-zero with --fail-on-validation
        command: [run, resolver]
        args: ["invalidNotMatch", "--fail-on-validation"]
        tags: [edge-case, validation, negative]
        expectFailure: true
        assertions:
          - expression: __exitCode != 0
            message: "Should fail validation"

      validate-resolver-passes:
        description: Verify 'validate resolver' exits 0 when validation passes
        command: [validate, resolver]
        args: ["validValue", "-o", "json"]
        tags: [edge-case, validation, smoke]
        assertions:
          - expression: __exitCode == 0
            message: "validate resolver must exit 0 when validation passes"
          - expression: '__output.validValue == "good"'
            message: "Resolved value must still be shown"

      validate-resolver-fails:
        description: Verify 'validate resolver' exits 2 (validation failed) on failure
        command: [validate, resolver]
        args: ["invalidRegex", "-o", "json"]
        tags: [edge-case, validation, negative]
        expectFailure: true
        assertions:
          - expression: __exitCode == 2
            message: "validate resolver must exit 2 on validation failure"
          - expression: '__output.invalidRegex == "BAD_VALUE!"'
            message: "Resolved value must still be shown despite validation failure"
          - expression: '__stderr.contains("failed validation")'
            message: "Validation diagnostics must appear on stderr"
