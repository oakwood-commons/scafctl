apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: credentials-solution-fixture
  version: 1.0.0
  description: Cross-platform credential ValueRef lint, render, and dry-run fixture
spec:
  calls:
    send_audit:
      description: Send audit event with nested scrt and tkn headers
      provider: http
      args:
        payload:
          type: string
          required: true
      inputs:
        url: https://audit.example.com/v1/events
        method: POST
        body:
          expr: _.args.payload
        headers:
          X-Audit-Key:
            scrt: audit-hmac-key
          Authorization:
            tkn: github

  resolvers:
    env_name:
      description: Target environment name
      type: string
      resolve:
        with:
          - provider: static
            inputs:
              value: staging

    service_token:
      description: Sensitive token resolved via tkn ValueRef
      type: string
      sensitive: true
      resolve:
        with:
          - provider: static
            inputs:
              value:
                tkn:
                  handler: gcp
                  scope: https://www.googleapis.com/auth/cloud-platform
                  minValidFor: 5m

  workflow:
    actions:
      verify-health:
        description: Check health endpoint using sensitive resolver and scrt header
        provider: http
        inputs:
          url:
            tmpl: "https://api.example.com/{{ .env_name }}/healthz"
          method: GET
          headers:
            Authorization:
              rslvr: service_token
            X-Service-Secret:
              scrt: service-shared-secret

      emit-audit:
        description: Emit audit record through reusable call
        dependsOn:
          - verify-health
        call: send_audit
        args:
          payload:
            tmpl: '{"env":"{{ .env_name }}"}'
