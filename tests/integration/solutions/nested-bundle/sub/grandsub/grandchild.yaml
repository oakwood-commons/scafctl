apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: nested-bundle-grandchild
  version: 1.0.0
  description: Grandchild sub-solution that reads its own local template file

spec:
  resolvers:
    grandchild-template:
      type: string
      resolve:
        with:
          - provider: file
            inputs:
              operation: read
              path: "templates/grandchild.tmpl"
      transform:
        with:
          - provider: cel
            inputs:
              expression: "__self.content"
