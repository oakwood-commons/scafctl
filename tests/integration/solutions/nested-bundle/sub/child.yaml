apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: nested-bundle-child
  version: 1.0.0
  description: Child sub-solution that reads its own local template file

spec:
  resolvers:
    child-template:
      type: string
      resolve:
        with:
          - provider: file
            inputs:
              operation: read
              path: "templates/child.tmpl"
      transform:
        with:
          - provider: cel
            inputs:
              expression: "__self.content"

    child-greeting:
      type: string
      resolve:
        with:
          - provider: cel
            inputs:
              expression: "'hello from child'"

    grandchild-result:
      type: any
      resolve:
        with:
          - provider: solution
            inputs:
              source: "./grandsub/grandchild.yaml"
