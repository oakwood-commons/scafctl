apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: composed-workflow
  version: 1.0.0
  description: |
    Regression fixture: a solution with a workflow action (whose name is only a
    map key) that also uses compose. Linting must NOT report a false-positive
    schema-violation on spec.workflow.actions.name -- the compose struct
    round-trip previously injected an empty action name into the validated
    content.

compose:
  - tests/cases.yaml

spec:
  resolvers:
    hello:
      description: A greeting
      resolve:
        with:
          - provider: static
            inputs:
              value: world

  workflow:
    actions:
      greet:
        description: Say hello
        provider: message
        inputs:
          message: hello
