apiVersion: scafctl.io/v1
kind: Solution
metadata:
  name: template-directory-integration
  version: 1.0.0
  description: Integration test for directory → render-tree → write-tree pipeline

bundle:
  include:
    - "**/*"
  plugins:
    - name: directory
      kind: provider
      version: latest

spec:
  resolvers:
    vars:
      type: any
      resolve:
        with:
          - provider: static
            inputs:
              value:
                appName: test-app
                appVersion: "2.0.0"
                namespace: test-ns
                replicas: 2
                servicePort: 8080
                logLevel: debug

    templateFiles:
      type: any
      resolve:
        with:
          - provider: directory
            inputs:
              operation: list
              path: templates
              recursive: true
              filterGlob: "*.tpl"
              includeContent: true

    rendered:
      type: any
      resolve:
        with:
          - provider: go-template
            inputs:
              operation: render-tree
              entries:
                expr: '_.templateFiles.entries'
              data:
                rslvr: vars

    # Per-entry data fan-out: one shared template rendered once per item, each
    # with its own `data` (shallow-merged over the shared `data`, per-entry wins)
    # and its own output path -- all in a single render-tree resolver.
    fanout:
      type: any
      resolve:
        with:
          - provider: go-template
            inputs:
              operation: render-tree
              # Shared data acts as the merge base for every entry.
              data:
                platformAppName: shared-app
              entries:
                expr: |
                  [
                    {
                      "path":    "envs/dev/backend.tf",
                      "content": "app={{ .platformAppName }} env={{ .environment }}",
                      "data":    {"environment": "dev"}
                    },
                    {
                      "path":    "envs/prod/backend.tf",
                      "content": "app={{ .platformAppName }} env={{ .environment }}",
                      "data":    {"platformAppName": "prod-app", "environment": "prod"}
                    },
                    {
                      "path":    "envs/none/backend.tf",
                      "content": "app={{ .platformAppName }}"
                    }
                  ]

    # Mixed tree: some entries rendered, some copied verbatim. rawGlobs marks
    # matching paths as raw; a per-entry `raw` flag overrides rawGlobs (raw:true
    # forces verbatim even without a glob match, raw:false forces rendering even
    # when a glob matches).
    mixed:
      type: any
      resolve:
        with:
          - provider: go-template
            inputs:
              operation: render-tree
              rawGlobs:
                - "**/*.raw"
              data:
                who: world
              entries:
                expr: |
                  [
                    {"path": "rendered.txt", "content": "hello {{ .who }}"},
                    {"path": "verbatim.raw", "content": "keep {{ .who }} literal"},
                    {"path": "forced.txt", "content": "copy {{ .who }} too", "raw": true},
                    {"path": "override.raw", "content": "render {{ .who }} anyway", "raw": false}
                  ]

    # Collection to fan the whole template tree out over.
    environments:
      type: any
      resolve:
        with:
          - provider: static
            inputs:
              value:
                - name: dev
                  region: us-east1
                - name: prod
                  region: us-central1

    # Tree fan-out: render every template file once per environment, routing
    # each environment's copy to a distinct envs/<name>/... path via
    # pathTemplate. forEach.in is a resolver reference (resolved by the spec
    # layer before the provider runs); the `env` alias and the reserved __file*
    # path parts are available in pathTemplate.
    treeFanout:
      type: any
      resolve:
        with:
          - provider: go-template
            inputs:
              operation: render-tree
              entries:
                expr: '_.templateFiles.entries'
              data:
                rslvr: vars
              forEach:
                item: env
                in:
                  rslvr: environments
              pathTemplate: >-
                envs/{{ .env.name }}/{{ if .__fileDir }}{{ .__fileDir }}/{{ end }}{{ .__fileStem }}

  workflow:
    actions:
      write-output:
        provider: file
        inputs:
          operation: write-tree
          basePath: $OUTPUT_DIR
          entries:
            rslvr: rendered
          outputPath: >-
            {{ if .__fileDir }}{{ .__fileDir }}/{{ end }}{{ .__fileStem }}

      # Write the per-entry fan-out output, preserving each entry's own path.
      write-fanout:
        provider: file
        inputs:
          operation: write-tree
          basePath: $OUTPUT_DIR
          entries:
            rslvr: fanout

      # Write the tree fan-out output; each entry already carries its
      # environment-scoped path from pathTemplate.
      write-tree-fanout:
        provider: file
        inputs:
          operation: write-tree
          basePath: $OUTPUT_DIR
          entries:
            rslvr: treeFanout

  testing:
    config:
      skipBuiltins: [resolve-defaults]

    cases:
      _base:
        description: Base for template-directory tests
        command: [run, resolver]
        args: ["-o", "json"]
        files: ["templates/**"]
        tags: [template-directory]
        assertions:
          - expression: __exitCode == 0

      templates-loaded:
        description: Verify template files were read
        extends: [_base]
        command: [run, resolver, templateFiles]
        assertions:
          - expression: size(__output.templateFiles.entries) == 4
            message: "Expected 4 template files"

      templates-rendered:
        description: Verify all templates were rendered with vars
        extends: [_base]
        command: [run, resolver, rendered]
        assertions:
          - expression: size(__output.rendered) == 4
            message: "Expected 4 rendered entries"
          - expression: '__output.rendered.exists(e, e.content.contains("test-app"))'
            message: "Rendered content should contain the appName variable"

      fanout-per-entry-data:
        description: Verify per-entry data fan-out merges over and overrides shared data
        extends: [_base]
        command: [run, resolver, fanout]
        assertions:
          - expression: size(__output.fanout) == 3
            message: "Expected 3 fanned-out entries"
          # Entry 0: per-entry data supplies `environment`; `platformAppName`
          # falls through from the shared data.
          - expression: '__output.fanout[0].content == "app=shared-app env=dev"'
            message: "dev entry should merge shared platformAppName with per-entry environment"
          # Entry 1: per-entry data overrides the shared `platformAppName`.
          - expression: '__output.fanout[1].content == "app=prod-app env=prod"'
            message: "prod entry per-entry data should win over shared data"
          # Entry 2: no per-entry data -- renders against shared data alone.
          - expression: '__output.fanout[2].content == "app=shared-app"'
            message: "entry without per-entry data should use shared data unchanged"
          - expression: '__output.fanout[0].path == "envs/dev/backend.tf"'
            message: "each entry keeps its own declared output path"

      mixed-raw-passthrough:
        description: Verify rawGlobs and per-entry raw control verbatim vs rendered output
        extends: [_base]
        command: [run, resolver, mixed]
        assertions:
          - expression: size(__output.mixed) == 4
            message: "Expected 4 mixed entries"
          # rendered.txt: no glob match, no raw flag -> rendered.
          - expression: '__output.mixed[0].content == "hello world"'
            message: "unmatched entry should be rendered"
          # verbatim.raw: matched by rawGlobs -> copied byte-for-byte.
          - expression: '__output.mixed[1].content == "keep {{ .who }} literal"'
            message: "rawGlobs-matched entry should be verbatim"
          # forced.txt: raw:true overrides no glob match -> verbatim.
          - expression: '__output.mixed[2].content == "copy {{ .who }} too"'
            message: "per-entry raw:true should force verbatim"
          # override.raw: raw:false overrides the glob match -> rendered.
          - expression: '__output.mixed[3].content == "render world anyway"'
            message: "per-entry raw:false should force rendering despite rawGlobs"

      tree-fanout-cross-product:
        description: Verify forEach renders the whole tree once per item into distinct paths
        extends: [_base]
        command: [run, resolver, treeFanout]
        assertions:
          # 4 template files x 2 environments = 8 entries.
          - expression: size(__output.treeFanout) == 8
            message: "Expected 4 templates x 2 environments = 8 entries"
          # Every output path is environment-scoped and .tpl-stripped; all
          # distinct (a duplicate path would be a hard error at render time).
          - expression: '__output.treeFanout.all(e, e.path.startsWith("envs/"))'
            message: "every fanned-out path should be routed under envs/<name>/"
          - expression: '__output.treeFanout.exists(e, e.path.startsWith("envs/dev/"))'
            message: "dev environment copies should exist"
          - expression: '__output.treeFanout.exists(e, e.path.startsWith("envs/prod/"))'
            message: "prod environment copies should exist"
          # Shared data (vars) is available inside every rendered copy.
          - expression: '__output.treeFanout.exists(e, e.content.contains("test-app"))'
            message: "shared data should be available in fanned-out content"
          # The .tpl suffix is stripped and subdirectories are preserved.
          - expression: '__output.treeFanout.exists(e, e.path == "envs/dev/k8s/deployment.yaml")'
            message: "pathTemplate should strip .tpl and preserve subdirectories per env"

