name: Benchmark

# Chatops-triggered benchmark comparison. Comment `/benchmark` on a PR to run it.
#
# This workflow is split into three jobs to keep secrets and write access away
# from the PR's own (potentially untrusted, fork-authored) code:
#   - `gate`: verifies the commenter is a maintainer (author_association) and
#     acknowledges the command. Never checks out PR code. Has `issues: write`
#     to react/comment and `pull-requests: read` to look up the PR's base SHA.
#   - `benchmark`: checks out and *executes* the PR's own code to produce
#     benchmark results. Runs with `contents: read` only -- no repo secrets,
#     no write permissions of any kind -- since this is the only job that
#     runs code the PR's author controls. Results are handed off as a build
#     artifact, not posted directly.
#   - `report`: never checks out or executes PR code. Downloads the artifact
#     produced by `benchmark` (from this same workflow run) and posts/updates
#     the PR comment. Has `issues: write` only.
#
# A trusted commenter does not make the PR's code trustworthy -- the job
# split (not the author_association check) is what protects secrets/write
# access from a malicious or compromised benchmark.

on:
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Authorize command
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/benchmark') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      issues: write
      pull-requests: read
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
    steps:
      - name: Acknowledge command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Get PR details
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('base_sha', pr.data.base.sha);

  benchmark:
    name: Run benchmarks (untrusted PR code)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Never reference secrets.SCAFCTL_SECRET_KEY here -- this job checks out
      # and executes the PR's own (untrusted) code. This literal is a public,
      # non-sensitive placeholder (the same value used in test.yml); no
      # benchmark in this repo actually reads it, it only exists so the env
      # var is non-empty if some future benchmark happens to check it.
      SCAFCTL_SECRET_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      # benchstat requires >= 6 samples for finite confidence intervals
      BENCH_COUNT: 6
      BENCH_TIME: 1s
    outputs:
      packages: ${{ steps.find-bench.outputs.packages }}
      empty: ${{ steps.benchstat.outputs.empty }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260312031701-16a31bc5fbd0

      # Only benchmark packages that were actually changed in this PR
      # and contain benchmark tests — avoids running the full suite.
      - name: Find changed benchmark packages
        id: find-bench
        run: |
          CHANGED_PKGS=$(git diff --name-only "${{ needs.gate.outputs.base_sha }}" HEAD -- '*.go' \
            | xargs -I{} dirname {} \
            | sort -u \
            | sed 's|^\./|./|; s|^|./|; s|^\./\./|./|' \
            || true)

          if [ -z "$CHANGED_PKGS" ]; then
            echo "No Go packages changed, skipping."
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BENCH_PKGS=""
          for pkg in $CHANGED_PKGS; do
            if grep -rl --include='*_test.go' 'func Benchmark' "$pkg" >/dev/null 2>&1; then
              BENCH_PKGS="$BENCH_PKGS $pkg"
            fi
          done
          BENCH_PKGS=$(echo "$BENCH_PKGS" | xargs)

          if [ -z "$BENCH_PKGS" ]; then
            echo "Changed packages have no benchmarks, skipping."
            echo "packages=" >> "$GITHUB_OUTPUT"
          else
            echo "packages=$BENCH_PKGS" >> "$GITHUB_OUTPUT"
            echo "Found changed benchmark packages: $BENCH_PKGS"
          fi

      - name: Run benchmarks on PR branch
        if: steps.find-bench.outputs.packages != ''
        run: |
          go test -run='^$' -bench='.' -benchmem \
            -benchtime="${BENCH_TIME}" -count="${BENCH_COUNT}" \
            -timeout=20m \
            -short \
            ${{ steps.find-bench.outputs.packages }} | tee pr-bench.txt

      - name: Checkout base branch
        if: steps.find-bench.outputs.packages != ''
        run: git checkout "${{ needs.gate.outputs.base_sha }}"

      - name: Run benchmarks on base branch
        if: steps.find-bench.outputs.packages != ''
        run: |
          go test -run='^$' -bench='.' -benchmem \
            -benchtime="${BENCH_TIME}" -count="${BENCH_COUNT}" \
            -timeout=20m \
            -short \
            ${{ steps.find-bench.outputs.packages }} | tee base-bench.txt

      - name: Compare benchmarks
        if: steps.find-bench.outputs.packages != ''
        id: benchstat
        run: |
          set +e
          RESULT=$(benchstat base-bench.txt pr-bench.txt 2>&1)
          # Only truly empty output should suppress the report -- a "no data"
          # substring can appear inside an otherwise-useful comparison (e.g.
          # mixed results), so don't treat that as empty.
          EMPTY=false
          if [ -z "$RESULT" ]; then
            EMPTY=true
          fi
          echo "empty=$EMPTY" >> "$GITHUB_OUTPUT"
          echo "$RESULT" > benchstat-result.txt
          set -e

      - name: Upload benchmark results
        if: steps.find-bench.outputs.packages != '' && steps.benchstat.outputs.empty != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchstat-result.txt
          retention-days: 5

  report:
    name: Post benchmark comparison
    needs: [gate, benchmark]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    env:
      BENCH_COUNT: 6
      BENCH_TIME: 1s
    steps:
      - name: Download benchmark results
        if: needs.benchmark.outputs.packages != '' && needs.benchmark.outputs.empty != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const { data: list } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const artifact = list.artifacts.find(a => a.name === 'benchmark-results');
            if (!artifact) {
              core.setFailed('benchmark-results artifact not found in this run');
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });

            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/benchmark-results.zip`, Buffer.from(download.data));

      - name: Extract artifact safely
        if: needs.benchmark.outputs.packages != '' && needs.benchmark.outputs.empty != 'true'
        run: |
          mkdir -p bench-artifacts
          unzip -j -o benchmark-results.zip benchstat-result.txt -d bench-artifacts/

      - name: Post benchmark comparison
        if: needs.benchmark.outputs.packages != '' && needs.benchmark.outputs.empty != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- benchmark-comparison -->';

            const result = fs.readFileSync('bench-artifacts/benchstat-result.txt', 'utf8').trim();

            // Sanitize: compute a fence delimiter longer than any backtick run in the content.
            const maxRun = (result.match(/`+/g) || []).reduce((max, s) => Math.max(max, s.length), 0);
            const fence = '`'.repeat(Math.max(maxRun + 1, 4));

            const body = [
              marker,
              '## Benchmark Comparison',
              '',
              '<details>',
              '<summary>Click to expand benchmark results</summary>',
              '',
              fence,
              result,
              fence,
              '',
              '</details>',
              '',
              '> **How to read**: `~` means no significant change, `+` means regression, `-` means improvement. `p`-value >= 0.05 means the difference is not statistically significant.',
              '>',
              `> Benchmarks ran with \`-count=${process.env.BENCH_COUNT}\` and \`-benchtime=${process.env.BENCH_TIME}\`.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            });

            // Only ever update a comment this workflow itself created --
            // never a user comment that happens to contain the marker text.
            const existing = comments.find(c => c.body.includes(marker) && c.user.login === 'github-actions[bot]');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body,
              });
            }

      - name: No benchmarks found
        if: needs.benchmark.outputs.packages == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- benchmark-comparison -->';
            const body = `${marker}\nNo changed packages in this PR contain benchmark tests -- nothing to compare.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            });

            // Only ever update a comment this workflow itself created --
            // never a user comment that happens to contain the marker text.
            const existing = comments.find(c => c.body.includes(marker) && c.user.login === 'github-actions[bot]');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body,
              });
            }
