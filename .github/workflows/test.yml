name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'editors/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependencies
        run: task mod

      - name: Run linter
        run: task lint

      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Test execution runs on Ubuntu only. Windows/macOS *build* breakage is
        # guarded by the `cross-compile` job below (see issue #822); running the
        # full `go test`/integration suite natively on those OSes is a separate,
        # still-open effort tracked by the commented-out matrix entries.
        # TODO: Re-enable macos-latest and windows-latest test runs when the
        # cross-platform test-execution issues are resolved.
        os: [ubuntu-latest]
    env:
      SCAFCTL_SECRET_KEY: ${{ secrets.SCAFCTL_SECRET_KEY || 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependencies
        run: task mod

      - name: Build
        run: go build ./...

      - name: Run tests with coverage
        run: task test-cover

      - name: Pre-warm plugin cache
        run: |
          task build
          ./dist/scafctl plugins install sleep directory env exec git hcl metadata

      - name: Run functional integration tests
        run: task integration

      - name: Lint solution examples and integration tests
        run: task lint:solutions

      - name: Run workflow script tests
        run: bash .github/workflows/tests/test-sign-plugin-parsing.sh

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Windows-only code paths (e.g. the LSP stack's terminal deps) cannot be
        # caught by the Linux/macOS test matrix, so smoke-check every goreleaser
        # target compiles. `go build ./...` is deliberately broader than the
        # release build (goreleaser only builds ./cmd/scafctl) so it also
        # exercises packages like pkg/lsp -- which is exactly what regressed in
        # issue #822. Do not narrow it to ./cmd/scafctl.
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependencies
        run: task mod

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Match the release build (goreleaser sets CGO_ENABLED=0) explicitly
          # rather than relying on Go's implicit cross-compile default.
          CGO_ENABLED: 0
        run: go build ./...

  plugin-sdk-compat:
    name: Plugin SDK Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Build echo plugin with SDK-only deps
        run: |
          set -euo pipefail
          sdk_version=$(go list -m -f '{{.Version}}' github.com/oakwood-commons/scafctl-plugin-sdk)
          workdir=$(mktemp -d)
          cp examples/plugins/echo/main.go "$workdir/"
          cd "$workdir"
          go mod init echo-plugin-sdk-compat
          go get "github.com/oakwood-commons/scafctl-plugin-sdk@${sdk_version}"
          go mod tidy
          go build -o echo-plugin .

          # Verify no scafctl dependency in the module graph
          if go mod graph | grep -q 'github.com/oakwood-commons/scafctl@'; then
            echo "ERROR: echo plugin still transitively depends on scafctl"
            go mod graph | grep 'github.com/oakwood-commons/scafctl@'
            exit 1
          fi

          echo "Echo plugin built successfully with SDK-only dependencies"
          ls -lh echo-plugin
