name: VS Code Extension

# Path-filtered CI for the VS Code extension (editors/vscode). Runs only when the
# extension changes, keeping it isolated from the Go build/test/lint jobs.

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode.yml'
  push:
    branches:
      - main
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Bundle
        run: npm run build

      - name: Package (.vsix)
        run: npm run package
