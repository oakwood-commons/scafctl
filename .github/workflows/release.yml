name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write  # Required for cosign keyless signing via OIDC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    env:
      SCAFCTL_SECRET_KEY: ${{ secrets.SCAFCTL_SECRET_KEY }}
    steps:
      - name: Validate release secret
        shell: bash
        run: |
          if [ -z "${SCAFCTL_SECRET_KEY}" ]; then
            echo "::error title=Missing release secret::secrets.SCAFCTL_SECRET_KEY is required for release builds. Configure it in repository or organization secrets."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependencies
        run: task mod

      - name: Run tests
        run: task test

      - name: Run functional integration tests
        run: task integration

  release:
    name: Create Release
    needs: [test]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: 'v2.14.3'
      
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      
      - name: Run GoReleaser
        run: task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GIT_EVENT: push
          GIT_REF: ${{ github.ref }}

      - name: Generate index.html
        run: task generate-index

      - name: Upload index.html to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" dist/index.html --clobber

  benchmark:
    name: Benchmark vs Previous Release
    needs: [release]
    runs-on: ubuntu-latest
    env:
      SCAFCTL_SECRET_KEY: ${{ secrets.SCAFCTL_SECRET_KEY }}
      # benchstat requires >= 6 samples for finite confidence intervals
      BENCH_COUNT: 6
      BENCH_TIME: 1s
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260312031701-16a31bc5fbd0

      - name: Find previous release tag
        id: prev-tag
        run: |
          current_tag="${GITHUB_REF#refs/tags/}"
          prev_tag=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "${current_tag}" | head -1)
          if [ -z "$prev_tag" ]; then
            echo "No previous release tag found (this is the first release), skipping comparison."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "Previous release: $prev_tag"
            echo "tag=$prev_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks on this release
        if: steps.prev-tag.outputs.tag != ''
        run: |
          go test -run='^$' -bench='.' -benchmem \
            -benchtime="${BENCH_TIME}" -count="${BENCH_COUNT}" \
            -timeout=30m \
            -short \
            ./... | tee release-bench.txt

      - name: Checkout previous release
        if: steps.prev-tag.outputs.tag != ''
        run: git checkout "${{ steps.prev-tag.outputs.tag }}"

      - name: Run benchmarks on previous release
        if: steps.prev-tag.outputs.tag != ''
        run: |
          go test -run='^$' -bench='.' -benchmem \
            -benchtime="${BENCH_TIME}" -count="${BENCH_COUNT}" \
            -timeout=30m \
            -short \
            ./... | tee prev-bench.txt

      - name: Compare benchmarks
        if: steps.prev-tag.outputs.tag != ''
        run: |
          {
            echo "Benchmark comparison: ${{ steps.prev-tag.outputs.tag }} vs ${GITHUB_REF#refs/tags/}"
            echo "Ran with -count=${BENCH_COUNT} -benchtime=${BENCH_TIME}"
            echo ""
            benchstat prev-bench.txt release-bench.txt
          } | tee benchmark-comparison.txt

      - name: Upload benchmark comparison to release
        if: steps.prev-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" benchmark-comparison.txt --clobber
